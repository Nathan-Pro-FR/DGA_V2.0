name: Sync Discord Media

on:
  schedule:
    - cron: "0 * * * *" # S'exécute automatiquement TOUTES LES HEURES
  workflow_dispatch: # Te permet de lancer la synchronisation manuellement depuis GitHub si besoin

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Backup previous donnees.json
        run: |
          if [ -f donnees.json ]; then
            cp donnees.json donnees.previous.json
          else
            echo "[]" > donnees.previous.json
          fi

      - name: Fetch Discord media and update data
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: node recupere_medias.js

      - name: Compute sync stats
        id: stats
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          
          function getMediaId(url) {
            if (!url) return null;
            const parts = url.split('?')[0].split('/');
            return parts[parts.length - 2] || url;
          }

          const oldData = JSON.parse(fs.readFileSync("donnees.previous.json", "utf8"));
          const newData = JSON.parse(fs.readFileSync("donnees.json", "utf8"));
          
          const oldMap = new Map();
          oldData.forEach(url => { const id = getMediaId(url); if(id) oldMap.set(id, url); });

          const newMap = new Map();
          newData.forEach(url => { const id = getMediaId(url); if(id) newMap.set(id, url); });

          let added = 0;
          let removed = 0;
          let refreshed = 0;

          // On cherche les nouveautés ou les rafraîchissements de jetons
          for (const [id, newUrl] of newMap.entries()) {
            if (!oldMap.has(id)) {
              added++;
            } else {
              const oldUrl = oldMap.get(id);
              // Si l'ID est identique mais que l'URL complète a changé, c'est un jeton expirable mis à jour par Discord
              if (oldUrl !== newUrl) {
                refreshed++;
              }
            }
          }
          
          for (const id of oldMap.keys()) {
            if (!newMap.has(id)) removed++;
          }

          const now = new Date();
          const unixTs = Math.floor(now.getTime() / 1000);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `added=${added}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `removed=${removed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `refreshed=${refreshed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `total=${newData.length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `timestamp=${now.toISOString()}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `timestamp_unix=${unixTs}\n`);
          NODE

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ADDED: ${{ steps.stats.outputs.added }}
          REMOVED: ${{ steps.stats.outputs.removed }}
          REFRESHED: ${{ steps.stats.outputs.refreshed }}
          TOTAL: ${{ steps.stats.outputs.total }}
          TIMESTAMP: ${{ steps.stats.outputs.timestamp }}
          TIMESTAMP_UNIX: ${{ steps.stats.outputs.timestamp_unix }}
        run: |
          node <<'NODE'
          const webhookUrl = process.env.DISCORD_WEBHOOK_URL;
          if (!webhookUrl) {
            console.log("No webhook URL configured. Skipping notification.");
            process.exit(0);
          }

          const added = parseInt(process.env.ADDED || "0", 10);
          const removed = parseInt(process.env.REMOVED || "0", 10);
          const refreshed = parseInt(process.env.REFRESHED || "0", 10);
          const total = parseInt(process.env.TOTAL || "0", 10);
          const timestamp = process.env.TIMESTAMP;
          const timestampUnix = process.env.TIMESTAMP_UNIX;

          const repoUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
          const runUrl = `${repoUrl}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const siteUrl = "https://Nathan-Pro-FR.github.io/Discord_Github_Action/"; // Optionnel : Remplace par le lien final de ton site si tu veux

          const payload = {
            username: "Gallery Sync Bot",
            embeds: [
              {
                title: "🔄 Synchronisation Galerie Discord",
                color: 0xec4899, // Rose néon cyberpunk
                
                // Intégration de ta nouvelle description avec Date complète et temps relatif
                description: `La galerie a été mise à jour le : <t:${timestampUnix}:F> • <t:${timestampUnix}:R>`,
                
                fields: [
                  { name: "➕ Ajoutés", value: String(added), inline: true },
                  { name: "➖ Supprimés", value: String(removed), inline: true },
                  { name: "🔄 Jetons rafraîchis", value: String(refreshed), inline: true },
                  { name: "📊 Total médias", value: String(total), inline: true },
                  { name: "🌐 Site web", value: `[Ouvrir la galerie](${siteUrl})`, inline: false },
                  { name: "🛠️ GitHub Action", value: `[Voir le rapport de run](${runUrl})`, inline: false }
                ],
                footer: {
                  text: `Statut: Réussi • ${timestamp}`
                }
              }
            ]
          };

          fetch(webhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          }).then(async (response) => {
            if (!response.ok) {
              const body = await response.text();
              throw new Error(`Discord webhook error ${response.status}: ${body}`);
            }
            console.log("Notification envoyée avec succès sur Discord.");
          }).catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit and push updated donnees.json
        run: |
          if git diff --quiet -- donnees.json; then
            echo "No token changes detected in donnees.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add donnees.json
          git commit -m "chore: refresh discord media tokens and history"
          git push
