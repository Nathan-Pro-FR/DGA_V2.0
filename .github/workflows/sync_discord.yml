name: Sync Discord Media

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 18 est End-of-Life (plus aucun correctif de sécurité depuis
          # avril 2025) et Node 20 l'est devenu à son tour en avril 2026.
          # Node 22 est la ligne LTS actuellement maintenue.
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Backup previous donnees.json
        run: |
          if [ -f donnees.json ]; then
            cp donnees.json donnees.previous.json
          else
            echo "[]" > donnees.previous.json
          fi

      - name: Fetch Discord media and update data
        id: fetch_media
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: node recupere_medias.js

      - name: Compute sync stats
        id: stats
        run: node calcul_stats.js

      - name: Send Discord notification
        id: webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ADDED: ${{ steps.stats.outputs.added }}
          REMOVED: ${{ steps.stats.outputs.removed }}
          REFRESHED: ${{ steps.stats.outputs.refreshed }}
          TOTAL: ${{ steps.stats.outputs.total }}
          TIMESTAMP: ${{ steps.stats.outputs.timestamp }}
          TIMESTAMP_UNIX: ${{ steps.stats.outputs.timestamp_unix }}
        run: node envoi_webhook.js

      - name: Commit and push updated donnees.json
        id: commit_push
        run: |
          # BUG CORRIGÉ : "git diff --quiet -- donnees.json" ne voit rien pour
          # un fichier non suivi par git (cas du tout premier run). On force
          # d'abord un "git add" puis on compare l'index à HEAD avec --cached,
          # ce qui détecte correctement un fichier neuf comme un fichier modifié.
          git add donnees.json
          if git diff --cached --quiet -- donnees.json; then
            echo "No token changes detected in donnees.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh discord media tokens and history"
          git push

      # BUG CORRIGÉ : cette étape était auparavant placée juste après
      # "Fetch Discord media", donc "if: failure()" ne pouvait détecter QUE
      # l'échec de recupere_medias.js. En la déplaçant en toute dernière
      # position, failure() reflète l'état de l'ensemble du job : un échec
      # de calcul_stats.js, envoi_webhook.js ou du commit/push déclenche
      # désormais aussi le MP d'alerte.
      - name: Send Direct Message on Failure
        if: failure()
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          ERROR_MESSAGE: |
            La synchronisation des médias a échoué (statut du job : ${{ job.status }}).
            - Récupération Discord (recupere_medias.js) : ${{ steps.fetch_media.outcome }}
            - Calcul des statistiques (calcul_stats.js) : ${{ steps.stats.outcome }}
            - Envoi du webhook (envoi_webhook.js) : ${{ steps.webhook.outcome }}
            - Commit/push donnees.json : ${{ steps.commit_push.outcome }}
            Vérifiez les logs du workflow pour plus de détails.
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: node notif_erreur_mp.js
